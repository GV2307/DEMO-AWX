name: Multi-Runner Python Test

on:
  workflow_dispatch:

jobs:

  run-legacy-python:
    runs-on: arc-runner-python27

    steps:
      - name: Verify Python 2.7
        run: |
          echo "Running on the Python 2.7 Runner!"
          python --version

  run-latest-python:
    runs-on: arc-runner-pythonlatest

    steps:
      - name: Verify Python Latest
        run: |
          echo "Running on the Python Latest Runner!"
          python --version
