name: Native Bash Systemd Runner Test

on:
  workflow_dispatch:

jobs:
  run-multi-python-tests:
    runs-on: self-hosted # Matches your runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Legacy Python 2.7
        run: |
          echo "Testing Python 2.7..."
          python2 --version

      - name: Verify Modern Python 3
        run: |
          echo "Testing Python 3..."
          python3 --version
