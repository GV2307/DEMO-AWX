name: Native Bash Systemd Runner Test

on:
  workflow_dispatch:

jobs:
  run-multi-python-tests:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Legacy Python 2.7
        run: |
          echo "Attempting to execute Python 2.7 via full path..."
          # Use the absolute path we set in the Dockerfile
          /usr/local/bin/python2.7 --version
          
      - name: Verify Modern Python 3
        run: |
          echo "Verifying Python 3..."
          /usr/bin/python3 --version
