name: Systemd Runner Test

on:
  workflow_dispatch:

jobs:
  python-test:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Python 2.7
        run: |
          echo "Running Python 2.7..."
          /usr/bin/python2.7 --version

      - name: Verify Python 3
        run: |
          echo "Running Python 3..."
          python3 --version
