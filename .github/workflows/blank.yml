name: Native Bash Systemd Runner Test

on:
  workflow_dispatch:

jobs:
  run-multi-python-tests:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Legacy Python 2.7
        run: |
          echo "Locating python2..."
          which python2 || which python
          /usr/local/bin/python2.7 --version

      - name: Verify Modern Python 3
        run: |
          echo "Locating python3..."
          which python3
          python3 --version
