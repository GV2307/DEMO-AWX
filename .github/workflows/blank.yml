jobs:
  run-tests:
    runs-on: self-hosted
    steps:
      - name: Verify Python 2.7
        run: |
          # Use the absolute path we confirmed in Step 2
          /usr/bin/python2.7 --version
      
      - name: Verify Python 3
        run: |
          # Use the system path
          /usr/bin/python3 --version
